# Production override for a public server:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
# deploy/update.sh uses exactly this. Paths are relative to the repository root.
services:
  pcbgit:
    # Only Caddy talks to pcbgit; nothing is published on the host.
    ports: !reset []
    environment:
      ORIGIN: https://${PCBGIT_DOMAIN:?set PCBGIT_DOMAIN in .env}
      # Client address from Caddy, which replaces any X-Forwarded-For a client sends.
      # Without it every visitor looks like Caddy and shares one sign-in limit.
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: "1"
      # Shared with the host's update watcher (deploy/install.sh sets it up).
      PCBGIT_CONTROL_DIR: /control
    volumes:
      - /var/lib/pcbgit-control:/control

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PCBGIT_DOMAIN: ${PCBGIT_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here; losing it means re-issuing them.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - pcbgit
    # Caddy's image runs as root; all it needs is to bind ports 80 and 443.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

volumes:
  caddy-data:
  caddy-config:
