# Tests, type checks and the app build on every push and pull request.
#
# A release is a pushed tag vX.Y.Z (git tag v0.7.1 && git push origin v0.7.1):
# its image is built, started and checked, published, and only then the GitHub
# release is created, so no release ever appears without its image. Servers
# install that image (deploy/update.sh --release) instead of building. The notes
# are the message of an annotated tag (git tag -a), else the commits since the
# previous tag. Do not create releases by hand on GitHub: the tag is what counts.
#
# Run it by hand (Actions → CI → Run workflow) to build a branch's image without
# releasing it, e.g. to try an update Dependabot proposes.
name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces a pull request's run; runs on master and tags are never
# cancelled.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

# Actions are pinned to commits: the image job can publish what servers run.
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Node version the Docker image ships (node:sqlite, --experimental-strip-types).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # The profile picture test needs the rasterisers; kicad-cli is not needed,
      # the pipeline tests run metadata-only renders without it.
      - name: Install thumbnail tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin webp

      - run: npm ci
      - run: npm test
      - run: npm run check
      # A build that breaks otherwise only shows when a release's image is built.
      - run: npm run build

  image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    # One build at a time, so they share the registry cache.
    concurrency:
      group: image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Servers only install tags named vX.Y.Z (update.sh): v.0.6.5 was published
      # and silently ignored. Pre-releases (vX.Y.Z-rc1) are built too.
      - name: Release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag \"$TAG\" is not vX.Y.Z or vX.Y.Z-suffix, so servers would never install it. Delete it (git push origin :refs/tags/$TAG) and push vX.Y.Z."
            exit 1
          fi

      # KiCad and its 3D models make a ~6 GB image; the runner's preinstalled
      # SDKs leave too little room to build and export it.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # GHCR names must be lower case; update.sh derives the same name from the remote.
      - name: Image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_ENV"
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >>"$GITHUB_ENV"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed as a candidate first. Servers look up sha-<commit>, which is only set
      # below, once this image has started and answered: a broken one never becomes
      # installable. The registry cache keeps the KiCad layers identical between
      # builds, so a server downloads only the layers that changed. Provenance and an
      # SBOM go with it, since servers install it unattended.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          build-args: PCBGIT_VERSION=${{ env.SHORT_SHA }}
          tags: ${{ env.IMAGE }}:candidate
          provenance: mode=max
          sbom: true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      # The builder's cache is in the registry now; its local copy only takes disk
      # the test below needs for pulling the image.
      - name: Free the builder's disk
        run: docker buildx prune --all --force

      # What unit tests cannot see: the image itself booting (migrations, files the
      # Dockerfile must copy) and answering. Its own health check decides.
      - name: Start the image and check it
        run: |
          docker pull "$IMAGE:candidate"
          docker run -d --name smoke -p 3000:3000 -e PCBGIT_ADMIN_PASSWORD=ci-smoke-test "$IMAGE:candidate"
          status=starting
          for _ in $(seq 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' smoke)
            [[ "$status" == healthy || "$status" == unhealthy ]] && break
            # Crashed on boot: no point waiting for the health check.
            [[ "$(docker inspect -f '{{.State.Running}}' smoke)" == true ]] || break
            sleep 5
          done
          docker logs smoke
          echo "health: $status"
          [[ "$status" == healthy ]]
          for page in / /login /tags /about; do curl -fsS -o /dev/null "http://localhost:3000$page"; done

      # Tagged with the full commit SHA, which is what a server looks up: it pulls
      # exactly the commit it checked out. Releases also get their version, and the
      # newest full release "latest". Copies the candidate's manifest in the registry.
      - name: Publish
        run: |
          tags=(-t "$IMAGE:sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=(-t "$IMAGE:$GITHUB_REF_NAME")
            # A pre-release (v0.8.0-rc1) never becomes "latest".
            [[ "$GITHUB_REF_NAME" == *-* ]] || tags+=(-t "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE:candidate"

  # The GitHub release, once the tag's image is published. Created with this run's
  # token, so it starts no further workflow run.
  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # All history and tags: the notes need the previous tag and this tag's message.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # An annotated tag's message is the notes as written; otherwise the commit
      # subjects since the previous release tag, without the NOTES bookkeeping.
      - name: Release notes
        run: |
          tag="$GITHUB_REF_NAME"
          : >notes.md
          if [[ "$(git cat-file -t "$tag")" == tag ]]; then
            git tag -l --format='%(contents)' "$tag" >notes.md
          fi
          if [[ ! -s notes.md ]]; then
            previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$tag^" 2>/dev/null || true)
            {
              echo "## Changes"
              echo
              git log --no-merges --format='- %s' "${previous:+$previous..}$tag" | grep -v '^- NOTES: release' || true
            } >notes.md
          fi
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::A release for $tag exists already; left as it is."
            exit 0
          fi
          flags=()
          [[ "$tag" == *-* ]] && flags+=(--prerelease)
          gh release create "$tag" --verify-tag --title "pcbgit $tag" --notes-file notes.md "${flags[@]}"
