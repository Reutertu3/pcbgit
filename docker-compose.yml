# Fixed project name: keeps the volume name stable whatever the folder is called.
name: pcbgit

services:
  pcbgit:
    build: .
    image: pcbgit:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Must match the URL users type, or form submissions fail the CSRF check.
      ORIGIN: ${PCBGIT_ORIGIN:-http://localhost:3000}
      PCBGIT_ADMIN_USER: ${PCBGIT_ADMIN_USER:-admin}
      PCBGIT_ADMIN_PASSWORD: ${PCBGIT_ADMIN_PASSWORD:?set PCBGIT_ADMIN_PASSWORD in .env}
      PCBGIT_ADMIN_EMAIL: ${PCBGIT_ADMIN_EMAIL:-admin@localhost}
    volumes:
      - pcbgit-data:/data

volumes:
  pcbgit-data:
