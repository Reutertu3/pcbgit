# Fixed project name: keeps the volume name stable whatever the folder is called.
name: kupfergit

services:
  kupfergit:
    build: .
    image: kupfergit:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Must match the URL users type, or form submissions fail the CSRF check.
      ORIGIN: ${KUPFERGIT_ORIGIN:-http://localhost:3000}
      KUPFERGIT_ADMIN_USER: ${KUPFERGIT_ADMIN_USER:-admin}
      KUPFERGIT_ADMIN_PASSWORD: ${KUPFERGIT_ADMIN_PASSWORD:?set KUPFERGIT_ADMIN_PASSWORD in .env}
      KUPFERGIT_ADMIN_EMAIL: ${KUPFERGIT_ADMIN_EMAIL:-admin@localhost}
    volumes:
      - kupfergit-data:/data

volumes:
  kupfergit-data:
