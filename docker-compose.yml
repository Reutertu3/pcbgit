# Fixed project name: keeps the volume name stable whatever the folder is called.
name: pcbgit

services:
  pcbgit:
    build:
      context: .
      args:
        # Set by deploy/update.sh so the admin panel can show the running commit.
        PCBGIT_VERSION: ${PCBGIT_GIT_SHA:-dev}
    # deploy/update.sh builds this image or pulls it from GHCR and tags it so.
    image: pcbgit:latest
    restart: unless-stopped
    ports:
      # Host port from .env; the app always listens on 3000 inside the container.
      - "${PCBGIT_PORT:-3000}:3000"
    environment:
      # Public URL for links in server-rendered pages and the cookie's scheme.
      ORIGIN: ${PCBGIT_ORIGIN:-http://localhost:${PCBGIT_PORT:-3000}}
      PCBGIT_ADMIN_USER: ${PCBGIT_ADMIN_USER:-admin}
      PCBGIT_ADMIN_PASSWORD: ${PCBGIT_ADMIN_PASSWORD:?set PCBGIT_ADMIN_PASSWORD in .env}
      PCBGIT_ADMIN_EMAIL: ${PCBGIT_ADMIN_EMAIL:-admin@localhost}
      # Release tag of the running commit, shown in the footer (set by deploy/update.sh).
      PCBGIT_TAG: ${PCBGIT_GIT_TAG:-}
      # Only read on the first start of an empty instance; see README.
      PCBGIT_IMPORT_SNAPSHOT: ${PCBGIT_IMPORT_SNAPSHOT:-}
      # AGPL-3.0: the footer links users to the source of the running code.
      # Forks running modified code must point this at their own repository.
      PCBGIT_SOURCE_URL: ${PCBGIT_SOURCE_URL:-https://github.com/Reutertu3/pcbgit}
      # Render tools run in the renderer service below, reached through this socket.
      PCBGIT_RENDER_DIR: /work
      PCBGIT_RENDER_SOCKET: /work/runner.sock
    volumes:
      - pcbgit-data:/data
      - pcbgit-render:/work
    depends_on:
      - renderer
    # The app runs as an unprivileged user on port 3000 and needs no capabilities.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # kicad-cli, iBOM and the thumbnail rasterisers parse uploaded boards. They run
  # here, with the current job's files as their only data: no database, no
  # repositories, no network, and a read-only system.
  renderer:
    image: pcbgit:latest
    # Built by the pcbgit service; never pulled.
    pull_policy: never
    command: ["node", "scripts/render-runner.ts"]
    restart: unless-stopped
    environment:
      PCBGIT_RENDER_DIR: /work
      PCBGIT_RENDER_SOCKET: /work/runner.sock
    volumes:
      - pcbgit-render:/work
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
      # kicad-cli writes its config and caches to HOME.
      - /home/pcbgit:uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Big boards need memory for the 3D export; raise it if renders get killed.
    mem_limit: 4g
    cpus: 2
    pids_limit: 512
    # The image's check fetches the web app, which does not run here.
    healthcheck:
      test: ["CMD", "test", "-S", "/work/runner.sock"]
      interval: 30s
      timeout: 5s

volumes:
  pcbgit-data:
  pcbgit-render:
