# Fixed project name: keeps the volume name stable whatever the folder is called.
name: pcbgit

services:
  pcbgit:
    build:
      context: .
      args:
        # Set by deploy/update.sh so the admin panel can show the running commit.
        PCBGIT_VERSION: ${PCBGIT_GIT_SHA:-dev}
        PCBGIT_TAG: ${PCBGIT_GIT_TAG:-}
    image: pcbgit:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Must match the URL users type, or form submissions fail the CSRF check.
      ORIGIN: ${PCBGIT_ORIGIN:-http://localhost:3000}
      PCBGIT_ADMIN_USER: ${PCBGIT_ADMIN_USER:-admin}
      PCBGIT_ADMIN_PASSWORD: ${PCBGIT_ADMIN_PASSWORD:?set PCBGIT_ADMIN_PASSWORD in .env}
      PCBGIT_ADMIN_EMAIL: ${PCBGIT_ADMIN_EMAIL:-admin@localhost}
      # Only read on the first start of an empty instance; see README.
      PCBGIT_IMPORT_SNAPSHOT: ${PCBGIT_IMPORT_SNAPSHOT:-}
      # AGPL-3.0: the footer links users to the source of the running code.
      # Forks running modified code must point this at their own repository.
      PCBGIT_SOURCE_URL: ${PCBGIT_SOURCE_URL:-https://github.com/Reutertu3/pcbgit}
    volumes:
      - pcbgit-data:/data

volumes:
  pcbgit-data:
